services:
  mongol-os-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mongol-os-web
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mailserver-proxy"
      - "traefik.http.middlewares.mongol-os-canonical.redirectregex.regex=^https?://www[.]mongol-os[.]org/?(.*)"
      - "traefik.http.middlewares.mongol-os-canonical.redirectregex.replacement=https://mongol-os.org/$${1}"
      - "traefik.http.middlewares.mongol-os-canonical.redirectregex.permanent=true"
      - "traefik.http.middlewares.mongol-os-https-only.redirectscheme.scheme=https"
      - "traefik.http.middlewares.mongol-os-https-only.redirectscheme.permanent=true"
      - "traefik.http.routers.mongol-os-web-http.rule=Host(`mongol-os.org`)"
      - "traefik.http.routers.mongol-os-web-http.entrypoints=web"
      - "traefik.http.routers.mongol-os-web-http.middlewares=mongol-os-https-only"
      - "traefik.http.routers.mongol-os-web-http.service=noop@internal"
      - "traefik.http.routers.mongol-os-www-http.rule=Host(`www.mongol-os.org`)"
      - "traefik.http.routers.mongol-os-www-http.entrypoints=web"
      - "traefik.http.routers.mongol-os-www-http.middlewares=mongol-os-canonical"
      - "traefik.http.routers.mongol-os-www-http.service=noop@internal"
      - "traefik.http.routers.mongol-os-www-https.rule=Host(`www.mongol-os.org`)"
      - "traefik.http.routers.mongol-os-www-https.entrypoints=websecure"
      - "traefik.http.routers.mongol-os-www-https.tls=true"
      - "traefik.http.routers.mongol-os-www-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mongol-os-www-https.middlewares=mongol-os-canonical"
      - "traefik.http.routers.mongol-os-www-https.service=noop@internal"
      - "traefik.http.routers.mongol-os-web.rule=Host(`mongol-os.org`)"
      - "traefik.http.routers.mongol-os-web.entrypoints=websecure"
      - "traefik.http.routers.mongol-os-web.tls=true"
      - "traefik.http.routers.mongol-os-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.mongol-os-web.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
    name: mailserver-proxy
